<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blogger Engine</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Editorial Header -->
  <header>
    <div class="nav-bar">
      <div class="brand">
        <span class="brand-emblem">✦</span>
        <span class="brand-title">Blogger Engine</span>
      </div>
      <div class="nav-meta">
        <span id="corpus-stats" class="nav-stats">8,242 ARTICLES</span>
        <a href="/docs" target="_blank" class="nav-link">API Docs</a>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Editorial Hero -->
    <section class="hero">
      <h2>Search technical articles</h2>
      <p>Find relevant articles and ask questions across the archive.</p>
    </section>

    <!-- Mode Switcher -->
    <nav class="mode-tabs">
      <button id="tab-search" class="mode-tab active" onclick="setMode('search')">Search</button>
      <button id="tab-ask" class="mode-tab" onclick="setMode('ask')">Ask</button>
    </nav>

    <!-- Elevated Search Bar -->
    <form class="search-form" onsubmit="handleQuery(event)">
      <div class="search-bar">
        <input
          type="text"
          id="query-input"
          class="search-input"
          placeholder="Search technical articles across machine learning, alignment, and systems..."
          required
          autocomplete="off"
        />
        <button type="submit" id="submit-btn" class="submit-btn">
          <span id="btn-text">Search</span>
          <span id="btn-spinner" class="spinner-icon" style="display: none;"></span>
        </button>
      </div>
    </form>

    <!-- In-Page Editorial Notice for API Status / Validation / System Degradation -->
    <div id="status-notice" class="editorial-notice" style="display: none;" role="alert" aria-live="polite">
      <div class="notice-icon">✦</div>
      <div class="notice-content">
        <div id="notice-title" class="notice-title">Notice</div>
        <div id="notice-msg" class="notice-body"></div>
      </div>
      <button type="button" class="notice-dismiss" onclick="dismissNotice()" aria-label="Dismiss notice">✕</button>
    </div>

    <!-- Results Section -->
    <section id="results-container" style="display: none;">
      <!-- QA Answer Box - Dominant Centerpiece in QA Mode -->
      <div id="qa-box" class="qa-box" style="display: none;">
        <div class="qa-headline">
          <span id="qa-badge" class="qa-badge">Answer</span>
          <span id="qa-confidence" class="qa-confidence" style="display: none;">CONFIDENCE 0.00</span>
        </div>
        <div id="qa-answer-text" class="qa-body"></div>
        <div id="qa-citations" class="qa-citations" style="display: none;">
          <span class="citation-label">Sources:</span>
          <div id="citations-list" style="display: flex; gap: 0.5rem; flex-wrap: wrap;"></div>
        </div>
      </div>

      <!-- Results Meta Header -->
      <div class="results-header">
        <span id="results-label" class="results-label">Search Results</span>
        <div class="results-stats">
          <span id="meta-count">0 items</span>
          <span>·</span>
          <span id="meta-latency">0.0 ms</span>
          <span id="meta-model" style="display: none; color: var(--gold-primary);"></span>
        </div>
      </div>

      <!-- Editorial Results List -->
      <div id="results-list" class="results-list"></div>
    </section>

    <!-- Empty State -->
    <div id="initial-state" class="empty-msg">
      <p>Enter a query or question to search the archive.</p>
    </div>
  </main>

  <script>
    let currentMode = 'search';
    let isSubmitting = false;
    let hasLoadedResults = false;
    const CANONICAL_TOP_K = 3;

    // Client-side text sanitization to resolve upstream encoding artifacts (mojibake) cleanly
    function sanitizeText(str) {
      if (!str) return '';
      return str
        .replace(/â€™/g, "'")
        .replace(/â€˜/g, "'")
        .replace(/â€œ/g, '"')
        .replace(/â€/g, '"')
        .replace(/â€”/g, '—')
        .replace(/â€“/g, '–')
        .replace(/â€¦/g, '…')
        .replace(/Â/g, '')
        .replace(/\u00A0/g, ' ');
    }

    let currentCitationsMap = {};

    function handleInlineCitationClick(docNum) {
      const chunkId = currentCitationsMap[String(docNum)];
      if (chunkId) {
        highlightRow(chunkId);
      } else {
        const idx = parseInt(docNum, 10) - 1;
        const rows = document.querySelectorAll('.result-row');
        if (rows && rows[idx]) {
          const rowId = rows[idx].id.replace('row-', '');
          highlightRow(rowId);
        }
      }
    }

    function formatMath(latex) {
      if (!latex) return '';
      let m = latex.trim();

      // Clean LaTeX font and environment commands
      m = m.replace(/\\mathrm\{([^}]+)\}/g, '$1')
           .replace(/\\text\{([^}]+)\}/g, '$1')
           .replace(/\\mathbf\{([^}]+)\}/g, '$1')
           .replace(/\\mathit\{([^}]+)\}/g, '$1')
           .replace(/\\mathcal\{D\}/g, '𝒟')
           .replace(/\\mathbb\{E\}/g, '𝔼')
           .replace(/\\mathbb\{R\}/g, 'ℝ')
           .replace(/\\mathbb\{P\}/g, 'ℙ')
           .replace(/\\mathbb\{N\}/g, 'ℕ')
           .replace(/\\mathbb\{Z\}/g, 'ℤ');

      // Greek letters
      const greek = {
        '\\pi': 'π', '\\theta': 'θ', '\\phi': 'φ', '\\varphi': 'φ',
        '\\alpha': 'α', '\\beta': 'β', '\\gamma': 'γ', '\\delta': 'δ',
        '\\epsilon': 'ε', '\\lambda': 'λ', '\\mu': 'μ', '\\sigma': 'σ',
        '\\tau': 'τ', '\\omega': 'ω', '\\eta': 'η', '\\rho': 'ρ',
        '\\zeta': 'ζ', '\\chi': 'χ', '\\psi': 'ψ',
        '\\Delta': 'Δ', '\\Sigma': 'Σ', '\\Omega': 'Ω', '\\Gamma': 'Γ', '\\Phi': 'Φ'
      };
      for (const [k, v] of Object.entries(greek)) {
        m = m.replaceAll(k, v);
      }

      // Operators & relation symbols
      m = m.replace(/\\sum/g, '∑')
           .replace(/\\prod/g, '∏')
           .replace(/\\int/g, '∫')
           .replace(/\\infty/g, '∞')
           .replace(/\\approx/g, '≈')
           .replace(/\\sim/g, '∼')
           .replace(/\\neq|\\ne/g, '≠')
           .replace(/\\leq|\\le/g, '≤')
           .replace(/\\geq|\\ge/g, '≥')
           .replace(/\\times/g, '×')
           .replace(/\\cdot/g, '·')
           .replace(/\\pm/g, '±')
           .replace(/\\in/g, '∈')
           .replace(/\\to/g, '→')
           .replace(/\\leftarrow/g, '←')
           .replace(/\\forall/g, '∀')
           .replace(/\\exists/g, '∃')
           .replace(/\\nabla/g, '∇')
           .replace(/\\partial/g, '∂');

      // Delimiters & spaces
      m = m.replace(/\\quad/g, '  ')
           .replace(/\\qquad/g, '   ')
           .replace(/\\[,;!]/g, ' ')
           .replace(/\\\|/g, ' ∥ ')
           .replace(/\\mid/g, ' | ')
           .replace(/\\Bigl\[|\\Biggl\[|\\left\[/g, '[')
           .replace(/\\Bigr\]|\\Biggr\]|\\right\]/g, ']')
           .replace(/\\Bigl\(|\\Biggl\(|\\left\(/g, '(')
           .replace(/\\Bigr\)|\\Biggr\)|\\right\)/g, ')')
           .replace(/\\Bigl\\\{|\\Biggl\\\{|\\left\\\{/g, '{')
           .replace(/\\Bigr\\\}|\\Biggr\\\}|\\right\\\}/g, '}')
           .replace(/\\displaystyle/g, '');

      // Fractions: \frac{a}{b} -> (a / b)
      for (let k = 0; k < 3; k++) {
        m = m.replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g, '($1 / $2)');
      }

      // Accents
      m = m.replace(/\\tilde\{([a-zA-Z])\}/g, '$1̃')
           .replace(/\\hat\{([a-zA-Z])\}/g, '$1̂')
           .replace(/\\bar\{([a-zA-Z])\}/g, '$1̄');

      // Subscripts & Superscripts
      m = m.replace(/_\{([^{}]+)\}/g, '<sub>$1</sub>')
           .replace(/_([a-zA-Z0-9α-ωΑ-Ω])/g, '<sub>$1</sub>')
           .replace(/\^\{([^{}]+)\}/g, '<sup>$1</sup>')
           .replace(/\^([a-zA-Z0-9α-ωΑ-Ω])/g, '<sup>$1</sup>');

      m = m.replace(/\s+/g, ' ').trim();
      return m;
    }

    function renderGroundedAnswer(rawMarkdown, citations = []) {
      if (!rawMarkdown) return '';

      // 1. Sanitize upstream mojibake encoding artifacts
      let text = sanitizeText(rawMarkdown);

      // 2. Strict HTML escaping to neutralize raw tags / scripts (XSS immunity)
      text = String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

      // Token storage
      const tokens = [];
      function addToken(html) {
        const id = `@@@TOKEN_${tokens.length}@@@`;
        tokens.push({ id, html });
        return id;
      }

      // 3. Extract Fenced Code Blocks (```lang ... ```)
      text = text.replace(/```([a-zA-Z0-9_-]*)\r?\n([\s\S]*?)```/g, (_, lang, code) => {
        const cleanLang = lang ? ` language-${lang}` : '';
        return addToken(`<div class="qa-code-wrapper"><pre class="qa-code-block"><code class="${cleanLang}">${code.trimEnd()}</code></pre></div>`);
      });

      // 4. Extract Block LaTeX Math \[ ... \]
      text = text.replace(/\\\[([\s\S]*?)\\\]/g, (_, math) => {
        return addToken(`<div class="math-display">${formatMath(math)}</div>`);
      });

      // 5. Extract Inline LaTeX Math \( ... \)
      text = text.replace(/\\\(([\s\S]*?)\\\)/g, (_, math) => {
        return addToken(`<span class="math-inline">${formatMath(math)}</span>`);
      });

      // 6. Extract Inline Code `...`
      text = text.replace(/`([^`\n]+)`/g, (_, code) => {
        return addToken(`<code class="qa-inline-code">${code}</code>`);
      });

      // 7. Extract Citations [Doc X] or [Doc X, Doc Y]
      text = text.replace(/\[Doc[\s\u00A0\u202F]*(\d+)(?:[\s\u00A0\u202F]*,[\s\u00A0\u202F]*(?:Doc[\s\u00A0\u202F]*)?(\d+))?\]/gi, (_, docNum1, docNum2) => {
        const b1 = `<button type="button" class="inline-citation" data-doc="${docNum1}" onclick="handleInlineCitationClick('${docNum1}')" title="Inspect source [Doc ${docNum1}]">[Doc ${docNum1}]</button>`;
        if (docNum2) {
          const b2 = `<button type="button" class="inline-citation" data-doc="${docNum2}" onclick="handleInlineCitationClick('${docNum2}')" title="Inspect source [Doc ${docNum2}]">[Doc ${docNum2}]</button>`;
          return addToken(`${b1} ${b2}`);
        }
        return addToken(b1);
      });

      // Helper for inline formatting on text segments
      function formatInline(str) {
        if (!str) return '';
        let out = str;
        // Bold: **text** or __text__
        out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        out = out.replace(/__([^_]+)__/g, '<strong>$1</strong>');
        // Italic: *text* or _text_
        out = out.replace(/\*([^\*\n]+?)\*/g, '<em>$1</em>');
        out = out.replace(/(^|[\s(])_([^_]+)_(?=[\s).,!?;:]|$)/g, '$1<em>$2</em>');
        // Links: only http/https allowed
        out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s\)\"]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" class="qa-link">$1</a>');
        // Strip malicious link protocols (e.g. javascript:)
        out = out.replace(/\[([^\]]+)\]\([^\)]*\)/g, '$1');
        return out;
      }

      // 8. Line-by-line block processing (tables, headings, blockquotes, lists, paragraphs)
      const lines = text.split(/\r?\n/);
      const outputBlocks = [];
      let i = 0;

      while (i < lines.length) {
        const line = lines[i];
        const trimmed = line.trim();

        if (!trimmed) {
          i++;
          continue;
        }

        // A. Markdown Table Detection
        if (line.includes('|') && i + 1 < lines.length && /^\s*\|?(\s*:?-+:?\s*\|)+\s*:?-+:?\s*\|?\s*$/.test(lines[i + 1])) {
          const headerLine = lines[i];
          const sepLine = lines[i + 1];
          i += 2;

          const parseRow = (rowStr) => {
            let cells = rowStr.trim().split('|');
            if (rowStr.trim().startsWith('|')) cells.shift();
            if (rowStr.trim().endsWith('|')) cells.pop();
            return cells.map(c => c.trim());
          };

          const headers = parseRow(headerLine);
          const sepCells = parseRow(sepLine);
          const alignments = sepCells.map(c => {
            const left = c.startsWith(':');
            const right = c.endsWith(':');
            if (left && right) return 'center';
            if (right) return 'right';
            return 'left';
          });

          const bodyRows = [];
          while (i < lines.length && lines[i].trim() && lines[i].includes('|')) {
            bodyRows.push(parseRow(lines[i]));
            i++;
          }

          let tableHtml = '<div class="qa-table-wrapper"><table class="qa-table"><thead><tr>';
          headers.forEach((h, colIdx) => {
            const align = alignments[colIdx] || 'left';
            tableHtml += `<th style="text-align: ${align}">${formatInline(h)}</th>`;
          });
          tableHtml += '</tr></thead><tbody>';

          bodyRows.forEach(row => {
            tableHtml += '<tr>';
            headers.forEach((_, colIdx) => {
              const val = row[colIdx] !== undefined ? row[colIdx] : '';
              const align = alignments[colIdx] || 'left';
              tableHtml += `<td style="text-align: ${align}">${formatInline(val)}</td>`;
            });
            tableHtml += '</tr>';
          });
          tableHtml += '</tbody></table></div>';
          outputBlocks.push(tableHtml);
          continue;
        }

        // B. Headings (# H1, ## H2, ### H3, #### H4)
        const headingMatch = line.match(/^(#{1,4})\s+(.+)$/);
        if (headingMatch) {
          const level = headingMatch[1].length;
          const content = formatInline(headingMatch[2].trim());
          outputBlocks.push(`<h${level} class="qa-heading qa-h${level}">${content}</h${level}>`);
          i++;
          continue;
        }

        // C. Blockquotes (> ...)
        if (line.match(/^\s*&gt;\s?/)) {
          const quoteLines = [];
          while (i < lines.length && lines[i].match(/^\s*&gt;\s?/)) {
            quoteLines.push(lines[i].replace(/^\s*&gt;\s?/, '').trim());
            i++;
          }
          const quoteContent = quoteLines.map(l => formatInline(l)).join('<br>');
          outputBlocks.push(`<blockquote class="qa-blockquote"><p>${quoteContent}</p></blockquote>`);
          continue;
        }

        // D. Unordered Lists (* item, - item)
        if (line.match(/^\s*[\*\-]\s+(.+)$/)) {
          const items = [];
          while (i < lines.length && lines[i].match(/^\s*[\*\-]\s+(.+)$/)) {
            const itemMatch = lines[i].match(/^\s*[\*\-]\s+(.+)$/);
            items.push(formatInline(itemMatch[1].trim()));
            i++;
          }
          const listHtml = `<ul class="qa-ul">${items.map(it => `<li>${it}</li>`).join('')}</ul>`;
          outputBlocks.push(listHtml);
          continue;
        }

        // E. Ordered Lists (1. item)
        if (line.match(/^\s*\d+\.\s+(.+)$/)) {
          const items = [];
          while (i < lines.length && lines[i].match(/^\s*\d+\.\s+(.+)$/)) {
            const itemMatch = lines[i].match(/^\s*\d+\.\s+(.+)$/);
            items.push(formatInline(itemMatch[1].trim()));
            i++;
          }
          const listHtml = `<ol class="qa-ol">${items.map(it => `<li>${it}</li>`).join('')}</ol>`;
          outputBlocks.push(listHtml);
          continue;
        }

        // F. Standalone Math or Block tokens
        if (trimmed.startsWith('@@@TOKEN_') && trimmed.endsWith('@@@') && !trimmed.includes(' ')) {
          outputBlocks.push(trimmed);
          i++;
          continue;
        }

        // G. Regular Paragraphs
        const paraLines = [];
        while (
          i < lines.length &&
          lines[i].trim() &&
          !lines[i].match(/^(#{1,4})\s+/) &&
          !lines[i].match(/^\s*&gt;\s?/) &&
          !lines[i].match(/^\s*[\*\-]\s+/) &&
          !lines[i].match(/^\s*\d+\.\s+/) &&
          !(lines[i].includes('|') && i + 1 < lines.length && /^\s*\|?(\s*:?-+:?\s*\|)+\s*:?-+:?\s*\|?\s*$/.test(lines[i + 1]))
        ) {
          paraLines.push(lines[i].trim());
          i++;
        }
        const paraContent = paraLines.map(l => formatInline(l)).join('<br>');
        outputBlocks.push(`<p class="qa-p">${paraContent}</p>`);
      }

      let finalHtml = outputBlocks.join('\n');

      // 9. Restore Tokens
      tokens.forEach(({ id, html }) => {
        finalHtml = finalHtml.replaceAll(id, html);
      });

      return finalHtml;
    }

    function extractHostname(url) {
      try {
        const parsed = new URL(url);
        return parsed.hostname.replace(/^www\./, '');
      } catch (e) {
        return '';
      }
    }

    function showNotice(title, message, level = 'warning') {
      const notice = document.getElementById('status-notice');
      const noticeTitle = document.getElementById('notice-title');
      const noticeMsg = document.getElementById('notice-msg');
      if (!notice || !noticeTitle || !noticeMsg) return;

      notice.className = `editorial-notice notice-${level}`;
      noticeTitle.textContent = title;
      noticeMsg.textContent = message;
      notice.style.display = 'flex';
    }

    function dismissNotice() {
      const notice = document.getElementById('status-notice');
      if (notice) notice.style.display = 'none';
    }

    async function parseApiError(res) {
      let title = 'Error';
      let message = 'An error occurred while processing your request.';

      if (res.status === 503) {
        title = 'Service Temporarily Unavailable';
        message = 'The search engine is currently unavailable or initializing. Please try again shortly.';
        return { title, message, level: 'warning' };
      }

      try {
        const data = await res.json();
        if (data) {
          if (typeof data.detail === 'string') {
            message = data.detail;
          } else if (Array.isArray(data.detail) && data.detail.length > 0) {
            message = data.detail
              .map(item => item.msg ? item.msg.replace(/^Value error,\s*/i, '') : JSON.stringify(item))
              .join('; ');
          } else if (data.message) {
            message = data.message;
          }
        }
      } catch (_) {
        message = `Server returned HTTP ${res.status}: ${res.statusText || 'Error'}`;
      }

      if (res.status >= 400 && res.status < 500) {
        title = 'Invalid Request';
        return { title, message, level: 'warning' };
      }

      title = 'Backend Processing Error';
      return { title, message, level: 'error' };
    }

    async function loadSystemStatus() {
      try {
        const statsRes = await fetch('/api/stats');
        if (statsRes.ok) {
          const stats = await statsRes.json();
          const statsEl = document.getElementById('corpus-stats');
          if (statsEl && stats.total_documents) {
            statsEl.textContent = `${stats.total_documents.toLocaleString()} ARTICLES`;
          }
        }
      } catch (_) {}
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('tab-search').classList.toggle('active', mode === 'search');
      document.getElementById('tab-ask').classList.toggle('active', mode === 'ask');
      document.getElementById('btn-text').textContent = mode === 'search' ? 'Search' : 'Ask';
      document.getElementById('query-input').placeholder = mode === 'search' 
        ? 'Search technical articles across machine learning, alignment, and systems...'
        : 'Ask a question across the archive...';
    }

    function fillQuery(text) {
      const input = document.getElementById('query-input');
      input.value = text;
      handleQuery(new Event('submit'));
    }

    async function handleQuery(e) {
      if (e) e.preventDefault();
      if (isSubmitting) return;

      const rawInput = document.getElementById('query-input').value;
      const query = rawInput.trim();
      if (!query) {
        showNotice('Notice', 'Please enter a search query or question.', 'warning');
        document.getElementById('query-input').focus();
        return;
      }

      dismissNotice();

      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');

      isSubmitting = true;
      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';

      const resultsContainer = document.getElementById('results-container');
      const initialState = document.getElementById('initial-state');
      const qaBox = document.getElementById('qa-box');
      const resultsLabel = document.getElementById('results-label');

      try {
        if (currentMode === 'search') {
          qaBox.style.display = 'none';
          resultsLabel.textContent = 'Search Results';

          const res = await fetch('/api/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, top_k: CANONICAL_TOP_K })
          });

          if (!res.ok) {
            const apiError = await parseApiError(res);
            const error = new Error(apiError.message);
            error.apiError = apiError;
            throw error;
          }

          const data = await res.json();

          hasLoadedResults = true;
          initialState.style.display = 'none';
          resultsContainer.style.display = 'block';

          document.getElementById('meta-count').textContent = `${data.total_results} results`;
          document.getElementById('meta-latency').textContent = `${data.latency_ms} ms`;
          document.getElementById('meta-model').style.display = 'none';

          renderPassages(data.results);
        } else {
          resultsLabel.textContent = 'Sources';

          const res = await fetch('/api/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, top_k: CANONICAL_TOP_K })
          });

          if (!res.ok) {
            const apiError = await parseApiError(res);
            const error = new Error(apiError.message);
            error.apiError = apiError;
            throw error;
          }

          const data = await res.json();

          hasLoadedResults = true;
          initialState.style.display = 'none';
          resultsContainer.style.display = 'block';

          document.getElementById('meta-count').textContent = `${data.sources.length} sources`;
          document.getElementById('meta-latency').textContent = `${data.latency_ms} ms`;
          
          const metaModel = document.getElementById('meta-model');
          metaModel.textContent = `· ${data.provider.toUpperCase()} / ${data.model}`;
          metaModel.style.display = 'inline';

          // QA Box State - Centerpiece
          qaBox.style.display = 'block';
          qaBox.classList.toggle('refused', data.refused);

          const qaBadge = document.getElementById('qa-badge');
          if (data.refused) {
            qaBadge.textContent = 'Not enough information in the archive';
          } else {
            qaBadge.textContent = 'Answer';
          }

          const confScore = (typeof data.confidence_score === 'number' && !isNaN(data.confidence_score))
            ? data.confidence_score.toFixed(3)
            : '0.000';
          const confEl = document.getElementById('qa-confidence');
          if (confEl) {
            confEl.textContent = `CONFIDENCE ${confScore}`;
            confEl.style.display = 'none';
          }

          // Map citations for inline interactive references
          currentCitationsMap = {};
          if (data.citations && data.citations.length > 0) {
            data.citations.forEach((c) => {
              const m = (c.doc_tag || '').match(/\d+/);
              if (m && c.chunk_id) {
                currentCitationsMap[m[0]] = c.chunk_id;
              }
            });
          }

          // Render answer with safe Markdown, math, and inline citations
          document.getElementById('qa-answer-text').innerHTML = renderGroundedAnswer(data.answer, data.citations);

          // Citations List
          const citationsContainer = document.getElementById('qa-citations');
          const citationsList = document.getElementById('citations-list');
          citationsList.innerHTML = '';

          if (data.citations && data.citations.length > 0) {
            citationsContainer.style.display = 'flex';
            data.citations.forEach((c) => {
              const tag = document.createElement('button');
              tag.className = 'citation-tag';
              const cleanDocNum = (c.doc_tag || '').replace(/[\[\]]/g, '');
              const cleanTitle = sanitizeText(c.title || '').substring(0, 26);
              tag.textContent = `${cleanDocNum} · ${cleanTitle}...`;
              tag.title = `${c.title || ''} (${c.url || ''})`;
              tag.onclick = () => highlightRow(c.chunk_id);
              citationsList.appendChild(tag);
            });
          } else {
            citationsContainer.style.display = 'none';
          }

          renderPassages(data.sources);
        }
      } catch (err) {
        if (err.apiError) {
          showNotice(err.apiError.title, err.apiError.message, err.apiError.level);
        } else if (err.name === 'TypeError' || (err.message && err.message.toLowerCase().includes('fetch'))) {
          showNotice(
            'Connection Notice',
            'Unable to reach the server. Please verify network connectivity.',
            'error'
          );
        } else {
          showNotice('Notice', err.message || 'An unexpected error occurred.', 'warning');
        }

        // If no results have ever loaded, maintain the clean initial state
        if (!hasLoadedResults) {
          initialState.style.display = 'block';
          resultsContainer.style.display = 'none';
        }
      } finally {
        isSubmitting = false;
        submitBtn.disabled = false;
        btnText.textContent = currentMode === 'search' ? 'Search' : 'Ask';
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    }

    function renderPassages(passages) {
      const container = document.getElementById('results-list');
      container.innerHTML = '';

      if (!passages || passages.length === 0) {
        container.innerHTML = '<p class="empty-msg">No matching articles found in the archive.</p>';
        return;
      }

      passages.forEach((p, idx) => {
        const row = document.createElement('div');
        row.className = 'result-row';
        row.id = `row-${p.chunk_id}`;

        const numStr = String(idx + 1).padStart(2, '0');
        const rawContent = sanitizeText((p.content || '').trim());
        const isLong = rawContent.length > 250;
        const excerpt = isLong ? rawContent.substring(0, 250) + '...' : rawContent;
        const host = extractHostname(p.url);
        const authorText = p.author && p.author !== 'Unknown' ? `By ${sanitizeText(p.author)}` : '';
        const sourceLine = [authorText, host].filter(Boolean).join(' · ');
        const scoreFormatted = (typeof p.score === 'number' && !isNaN(p.score)) ? p.score.toFixed(4) : '0.0000';

        row.innerHTML = `
          <div class="row-top">
            <div class="row-title-wrap">
              <span class="row-index">${numStr}</span>
              <a href="${escapeHtml(p.url || '#')}" target="_blank" rel="noopener noreferrer" class="row-title">
                ${escapeHtml(sanitizeText(p.title || 'Untitled Article'))}
              </a>
            </div>
            <span class="row-score">Score ${scoreFormatted}</span>
          </div>

          ${sourceLine ? `<div class="row-author-source">${escapeHtml(sourceLine)}</div>` : ''}

          <div class="row-content">
            <div id="excerpt-${p.chunk_id}" class="row-excerpt">${escapeHtml(excerpt)}</div>
            ${isLong ? `
              <div id="full-${p.chunk_id}" class="row-full">${escapeHtml(rawContent)}</div>
              <div id="meta-${p.chunk_id}" class="row-expanded-meta">
                <span>CHUNK #${p.chunk_index}</span>
                <span>${p.word_count} WORDS</span>
                <span>ID: ${escapeHtml(p.chunk_id || '')}</span>
              </div>
              <button type="button" class="toggle-passage-btn" onclick="togglePassage('${p.chunk_id}', this)">
                Read full passage ↓
              </button>
            ` : ''}
          </div>
        `;
        container.appendChild(row);
      });
    }

    function togglePassage(chunkId, btn) {
      const excerptEl = document.getElementById(`excerpt-${chunkId}`);
      const fullEl = document.getElementById(`full-${chunkId}`);
      const metaEl = document.getElementById(`meta-${chunkId}`);
      if (!excerptEl || !fullEl) return;

      const isExpanded = fullEl.style.display === 'block';
      if (isExpanded) {
        fullEl.style.display = 'none';
        excerptEl.style.display = 'block';
        if (metaEl) metaEl.style.display = 'none';
        btn.textContent = 'Read full passage ↓';
      } else {
        fullEl.style.display = 'block';
        excerptEl.style.display = 'none';
        if (metaEl) metaEl.style.display = 'flex';
        btn.textContent = 'Collapse passage ↑';
      }
    }

    function highlightRow(chunkId) {
      const el = document.getElementById(`row-${chunkId}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('highlighted');
        setTimeout(() => {
          el.classList.remove('highlighted');
        }, 2200);
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    loadSystemStatus();
  </script>
</body>
</html>
